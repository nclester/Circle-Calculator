<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Circle Calculator</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1 class="Title">Circle Calculator</h1>
        <h3 class="textBox">Enter the Radius for Your Desired Circle Below</h3>

        <form id="circleForm" action="/calculate" method="POST">
            <input class="radiusInput" type="number" id="radiusInput" name="radiusInput" placeholder="Enter Radius" step="any">
            <button class="generateButton" type="submit" id="generateButton">Calculate Circle</button>
        </form>


        <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    </body>
</html>
